# Workflow de CI PROPUESTO para las pruebas de aseguramiento de calidad de OWASP Juice Shop.
# Para usarlo: copiar a .github/workflows/qa.yml en el repositorio propio del grupo (con la carpeta pruebas/).
# Estado: propuesta; no se ha ejecutado en GitHub Actions.
name: QA - pruebas automatizadas

on:
  push:
  pull_request:

jobs:
  pruebas-funcionales:
    runs-on: ubuntu-latest
    services:
      juice-shop:
        image: bkimminich/juice-shop:latest
        ports:
          - 3100:3000
    defaults:
      run:
        working-directory: pruebas
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: pruebas/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Esperar a que el sistema responda
        run: npx --yes wait-on http://localhost:3100/rest/admin/application-version --timeout 90000
      - name: Pruebas automatizadas (Playwright)
        run: npx playwright test
      - name: Publicar reportes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-playwright
          path: evidencias/automatizadas/

  prueba-de-carga:
    runs-on: ubuntu-latest
    services:
      juice-shop:
        image: bkimminich/juice-shop:latest
        ports:
          - 3100:3000
    steps:
      - uses: actions/checkout@v4
      - uses: grafana/setup-k6-action@v1
      - name: k6 (falla si no se cumplen los umbrales p95 < 1000 ms y errores < 1 %)
        run: k6 run -e BASE_URL=http://localhost:3100 pruebas/rendimiento/carga-busqueda.js

  seguridad-dinamica:
    runs-on: ubuntu-latest
    services:
      juice-shop:
        image: bkimminich/juice-shop:latest
        ports:
          - 3100:3000
    steps:
      - uses: actions/checkout@v4
      - name: OWASP ZAP baseline
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: http://localhost:3100
          fail_action: false

  analisis-estatico:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: SonarQube scan con Quality Gate
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
      - uses: SonarSource/sonarqube-quality-gate-action@v1
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
